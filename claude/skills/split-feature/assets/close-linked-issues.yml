name: Close linked issues

# GitHub closes the issues a PR references with "Closes #n" only when the PR merges into the default branch.
# Sub-issue PRs merge into an epic branch, so this closes their issues on merge, which
# unblocks the sub-issues they block.
#
# pull_request_target runs the workflow from the default branch, so it works for epic branches cut before this file
# existed. It never checks out or runs PR code; the PR body is only read through an environment variable.

on:
  pull_request_target:
    types: [closed]

permissions:
  issues: write

jobs:
  close:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref != github.event.repository.default_branch
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_BODY: ${{ github.event.pull_request.body }}
      BASE_REF: ${{ github.event.pull_request.base.ref }}
    steps:
      - name: Close issues referenced with a closing keyword
        run: |
          numbers=$(printf '%s' "$PR_BODY" \
            | grep -oiE '\b(close[sd]?|fix(e[sd])?|resolve[sd]?):?[[:space:]]+#[0-9]+\b' \
            | grep -oE '[0-9]+$' | sort -un || true)
          if [ -z "$numbers" ]; then
            echo "No closing keyword in PR #$PR_NUMBER."
            exit 0
          fi
          for n in $numbers; do
            info=$(gh api "repos/$GH_REPO/issues/$n" --jq '[.state, (.pull_request != null)] | @tsv') || {
              echo "::warning::#$n not found"; continue; }
            state=$(cut -f1 <<<"$info"); is_pr=$(cut -f2 <<<"$info")
            if [ "$is_pr" = true ] || [ "$state" != open ]; then
              echo "Skip #$n ($state, pr=$is_pr)"; continue
            fi
            gh issue close "$n" --reason completed --comment "Closed by #$PR_NUMBER, merged into \`$BASE_REF\`."
          done
